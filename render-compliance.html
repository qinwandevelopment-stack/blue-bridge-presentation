<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1600, initial-scale=1.0">
<title>Render Compliance</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;width:1600px;height:900px;overflow:hidden;font-family:Cairo,sans-serif;background:#06203a}.scene{position:relative;width:1600px;height:900px;background:linear-gradient(135deg,#021325 0%,#09487c 100%);color:#fff}.grid{position:absolute;inset:0;background-image:radial-gradient(circle at center,rgba(125,211,252,.1) 2px,transparent 2px);background-size:40px 40px}.shield{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:500px;height:550px;background:rgba(2,19,37,.6);border:4px solid #7dd3fc;border-radius:20px 20px 250px 250px;box-shadow:0 0 120px rgba(125,211,252,.2),inset 0 0 80px rgba(125,211,252,.1);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px}.shield h1{font-size:72px;color:#fff;margin:0;line-height:1.2;font-weight:900}.shield p{font-size:32px;color:#9ddcff;margin:10px 0 0}.node{position:absolute;background:rgba(255,255,255,.05);border:2px solid;border-radius:24px;padding:30px 40px;backdrop-filter:blur(10px);min-width:300px}.node b{display:block;font-size:38px;margin-bottom:10px;direction:ltr}.node p{font-size:22px;color:rgba(255,255,255,.7);margin:0;line-height:1.5}.n1{left:150px;top:150px;border-color:#22d3ee}.n1 b{color:#22d3ee;text-align:right}.n2{right:150px;top:150px;border-color:#7dd3fc}.n2 b{color:#7dd3fc;text-align:left}.n3{left:200px;bottom:150px;border-color:#f3d675}.n3 b{color:#f3d675;text-align:right}.n4{right:200px;bottom:150px;border-color:#c9a84c}.n4 b{color:#c9a84c;text-align:left}.line{position:absolute;border-radius:10px;background:rgba(255,255,255,.1)}.l1{left:450px;top:250px;width:120px;height:4px;transform:rotate(20deg)}.l2{right:450px;top:250px;width:120px;height:4px;transform:rotate(-20deg)}.l3{left:480px;bottom:300px;width:150px;height:4px;transform:rotate(-30deg)}.l4{right:480px;bottom:300px;width:150px;height:4px;transform:rotate(30deg)}
</style>
</head>
<body>
<div class="scene"><div class="grid"></div>
<div class="line l1"></div><div class="line l2"></div><div class="line l3"></div><div class="line l4"></div>
<div class="shield"><h1>الامتثال<br>الدولي</h1><p>سيادة · أمان · شفافية</p></div>
<div class="node n1"><b>AfCFTA</b><p>تطبيق قواعد المنشأ والمواصفات الأفريقية الموحدة.</p></div>
<div class="node n2"><b>WCO SAFE</b><p>إرساء معايير أمن التجارة وسلاسل الإمداد العالمية.</p></div>
<div class="node n3"><b>AML/KYC</b><p>الامتثال المالي وإجراءات التعرف على الجهات والعملاء.</p></div>
<div class="node n4"><b>Data Sovereignty</b><p>سيادة البيانات من خلال نافذة وطنية تديرها شبكة ليبيا.</p></div>
</div>
</body>
</html>
