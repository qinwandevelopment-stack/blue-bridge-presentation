<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1600, initial-scale=1.0">
<title>Render Finance</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;width:1600px;height:900px;overflow:hidden;font-family:Cairo,sans-serif;background:#010a18}.scene{position:relative;width:1600px;height:900px;background:radial-gradient(circle at 50% 40%,rgba(243,214,117,.15),transparent 60%),linear-gradient(135deg,#021325 0%,#052a53 100%);color:#fff}.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(243,214,117,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(243,214,117,.05) 1px,transparent 1px);background-size:50px 50px}.title{position:absolute;top:70px;width:100%;text-align:center}.title h1{font-size:62px;margin:0;color:#f3d675;text-shadow:0 10px 40px rgba(243,214,117,.4);font-weight:900}.title p{font-size:26px;color:rgba(255,255,255,.8);margin:10px 0 0}.center-orb{position:absolute;left:50%;top:480px;transform:translate(-50%,-50%);width:360px;height:360px;background:radial-gradient(circle,rgba(243,214,117,.2),transparent 70%);border:4px solid rgba(243,214,117,.6);border-radius:50%;display:grid;place-items:center;box-shadow:0 0 100px rgba(243,214,117,.3),inset 0 0 60px rgba(243,214,117,.2)}.wallet{width:160px;height:120px;background:linear-gradient(145deg,#dfa822,#f3d675);border-radius:20px;box-shadow:0 20px 40px rgba(0,0,0,.5);position:relative}.wallet:after{content:"";position:absolute;top:20px;right:-10px;width:80px;height:80px;background:rgba(255,255,255,.3);border-radius:10px}.orb-text{position:absolute;bottom:-70px;width:100%;text-align:center;font-size:38px;color:#fff;font-weight:900}.card{position:absolute;width:400px;height:240px;background:rgba(2,19,37,.7);border:2px solid;border-radius:30px;padding:40px;box-shadow:0 30px 60px rgba(0,0,0,.4);backdrop-filter:blur(15px)}.left-card{left:180px;top:360px;border-color:#7dd3fc}.right-card{right:180px;top:360px;border-color:#22d3ee}.card h2{font-size:42px;margin:0 0 15px;color:#fff}.left-card h2{color:#7dd3fc}.right-card h2{color:#22d3ee}.card p{font-size:22px;color:rgba(255,255,255,.7);line-height:1.6;margin:0}.line{position:absolute;top:480px;width:240px;height:4px;background:linear-gradient(90deg,transparent,#f3d675,transparent);filter:blur(1px);box-shadow:0 0 20px #f3d675}.l1{left:380px}.l2{right:380px}.bottom-text{position:absolute;bottom:80px;width:100%;text-align:center}.bottom-text span{display:inline-block;padding:15px 40px;background:rgba(243,214,117,.15);border:2px solid rgba(243,214,117,.5);border-radius:999px;font-size:28px;color:#fff7d6;font-weight:900}</style>
</head>
<body>
<div class="scene"><div class="grid"></div>
<div class="title"><h1>إعادة تدوير الخدمات المالية والتأمينية</h1><p>سيولة · موثوقية · توطين داخل الاقتصاد الوطني</p></div>
<div class="line l1"></div><div class="line l2"></div>
<div class="center-orb"><div class="wallet"></div><div class="orb-text">محفظة العبور الرقمية</div></div>
<div class="card left-card"><h2>المصارف</h2><p>ضامن موثوق يوفر سيولة من العملة الصعبة عبر النظام المصرفي الليبي.</p></div>
<div class="card right-card"><h2>التأمين</h2><p>توطين وإلزام بإصدار بوليصة عبور شاملة من شركات التأمين الليبية.</p></div>
<div class="bottom-text"><span>تدوير القيمة داخل ليبيا</span></div>
</div>
</body>
</html>
