<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1600, initial-scale=1.0">
<title>Render Market Impact</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;width:1600px;height:900px;overflow:hidden;font-family:Cairo,sans-serif;background:#021325}.scene{position:relative;width:1600px;height:900px;background:linear-gradient(135deg,#021325 0%,#09487c 100%);color:#fff}.title{position:absolute;top:60px;left:100px;width:700px}.title h1{font-size:68px;margin:0;color:#fff;line-height:1.2;font-weight:900}.title h1 span{color:#7dd3fc}.title p{font-size:28px;color:#9ddcff;margin:20px 0 0;line-height:1.6}.bars{position:absolute;bottom:100px;left:100px;display:flex;align-items:flex-end;gap:40px;height:450px}.bar-group{display:flex;flex-direction:column;align-items:center;gap:20px}.bar{width:160px;background:linear-gradient(180deg,#7dd3fc,#0878ad);border-radius:20px 20px 10px 10px;box-shadow:inset 0 4px 20px rgba(255,255,255,.5),0 20px 40px rgba(0,0,0,.4);display:flex;justify-content:center;align-items:flex-start;padding-top:20px}.b1{height:250px}.b2{height:180px;background:linear-gradient(180deg,#22d3ee,#063064);opacity:.9}.b3{height:400px;background:linear-gradient(180deg,#dff6ff,#0b6f9f)}.bar span{font-size:42px;font-weight:900;color:#021325}.label{font-size:28px;font-weight:800;color:#fff;background:rgba(2,19,37,.6);padding:10px 24px;border-radius:12px;border:1px solid rgba(125,211,252,.3)}.circle-stat{position:absolute;right:150px;top:250px;width:400px;height:400px;border-radius:50%;background:rgba(2,19,37,.6);border:12px solid #f3d675;box-shadow:0 0 80px rgba(243,214,117,.2),inset 0 0 60px rgba(243,214,117,.1);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.circle-stat b{font-size:78px;color:#fff;font-weight:900;line-height:1}.circle-stat span{font-size:32px;color:#f3d675;margin-top:10px}.circle-stat p{font-size:22px;color:rgba(255,255,255,.7);margin:10px 0 0}.badges{position:absolute;right:150px;bottom:100px;display:flex;gap:20px}.badge{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);padding:15px 30px;border-radius:16px;font-size:26px;font-weight:800}.badge b{color:#7dd3fc;margin-left:10px}</style>
</head>
<body>
<div class="scene">
<div class="title"><h1>الديموغرافيا <br><span>والتأثير الاقتصادي</span></h1><p>استهداف سوق بشري هائل ضمن دول الطوق والعمق، مع تحسين كفاءة سلاسل الإمداد بنسب قياسية.</p></div>
<div class="bars">
<div class="bar-group"><div class="bar b1"><span>27M</span></div><div class="label">النيجر</div></div>
<div class="bar-group"><div class="bar b2"><span>19M</span></div><div class="label">تشاد</div></div>
<div class="bar-group"><div class="bar b3"><span>48M</span></div><div class="label">مالي وبوركينا</div></div>
</div>
<div class="circle-stat"><b>$15.54B</b><span>واردات مستهدفة</span><p>قابلة للتحويل لخدمات عبور</p></div>
<div class="badges">
<div class="badge"><b>12%</b> خفض التكلفة</div>
<div class="badge"><b>3-5</b> أيام عبور</div>
</div>
</div>
</body>
</html>
