<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1600, initial-scale=1.0">
<title>Render Sea Air</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;width:1600px;height:900px;overflow:hidden;font-family:Cairo,sans-serif;background:#031326}.scene{position:relative;width:1600px;height:900px;background:radial-gradient(circle at 50% 50%,rgba(11,111,159,.2),transparent 60%),linear-gradient(135deg,#021325 0%,#063064 50%,#021325 100%);color:#fff}.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(circle at center,black,transparent 80%)}.title{position:absolute;top:60px;width:100%;text-align:center}.title h1{font-size:64px;margin:0;color:#e0f7ff;text-shadow:0 10px 30px rgba(0,0,0,.5);font-weight:900}.title h1 span{color:#7dd3fc}.title p{font-size:26px;color:#9ddcff;margin:10px 0 0}.sky{position:absolute;top:0;left:0;right:0;height:450px;background:linear-gradient(180deg,rgba(125,211,252,.1) 0%,transparent 100%)}.sea{position:absolute;bottom:0;left:0;right:0;height:350px;background:linear-gradient(0deg,#031d35,rgba(8,120,173,.3))}.path{position:absolute;left:300px;top:400px;width:1000px;height:350px}.path svg{overflow:visible}.node{position:absolute;display:grid;place-items:center;background:rgba(2,19,37,.8);border:4px solid;border-radius:24px;box-shadow:0 20px 50px rgba(0,0,0,.4);backdrop-filter:blur(10px)}.node b{font-size:32px;color:#fff;margin-bottom:8px}.node p{font-size:18px;color:rgba(255,255,255,.7);margin:0}.port{left:200px;bottom:150px;width:260px;height:140px;border-color:#22d3ee;box-shadow:0 0 40px rgba(34,211,238,.3)}.airport{right:200px;top:200px;width:260px;height:140px;border-color:#7dd3fc;box-shadow:0 0 40px rgba(125,211,252,.3)}.bonded{left:550px;top:450px;width:280px;height:120px;border-color:#f3d675;box-shadow:0 0 40px rgba(243,214,117,.3);border-radius:60px}.icon{width:80px;height:80px;background:rgba(255,255,255,.1);border-radius:50%;display:grid;place-items:center;margin-bottom:-20px;transform:translateY(-50%);border:2px solid}.port .icon{border-color:#22d3ee}.airport .icon{border-color:#7dd3fc}.bonded .icon{border-color:#f3d675;margin-bottom:-10px;transform:none}.plane-shape{width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-bottom:40px solid #7dd3fc}.ship-shape{width:40px;height:20px;background:#22d3ee;border-radius:5px 5px 20px 20px}.truck-shape{width:30px;height:20px;background:#f3d675;border-radius:5px}</style>
</head>
<body>
<div class="scene"><div class="grid"></div><div class="sky"></div><div class="sea"></div>
<div class="title"><h1>المسار المتعدد <span>بحر - جو</span></h1><p>اقتران انتقالي وتتبع أرضي وجوي حتى الإبراء النهائي</p></div>
<div class="path">
<svg width="1000" height="350" viewBox="0 0 1000 350">
<path d="M 130 180 C 250 180 350 -50 870 -50" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="20" stroke-linecap="round"/>
<path d="M 130 180 C 250 180 350 -50 870 -50" fill="none" stroke="#7dd3fc" stroke-width="6" stroke-dasharray="15 20" stroke-linecap="round"/>
<circle cx="130" cy="180" r="15" fill="#22d3ee"/>
<circle cx="500" cy="80" r="12" fill="#f3d675"/>
<circle cx="870" cy="-50" r="15" fill="#7dd3fc"/>
</svg>
</div>
<div class="node port"><div class="icon"><div class="ship-shape"></div></div><b>الميناء</b><p>Fast Track</p></div>
<div class="node bonded"><div style="display:flex;align-items:center;gap:15px"><div class="icon"><div class="truck-shape"></div></div><div><b>نقل مقيد</b><p>Bonded Transfer</p></div></div></div>
<div class="node airport"><div class="icon"><div class="plane-shape"></div></div><b>المطار</b><p>Take-off & Release</p></div>
</div>
</body>
</html>
