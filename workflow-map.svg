<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Digital Blue Bridge Workflow</title>
  <desc id="desc">A stylized digital logistics workflow from ports through secure land and air corridors to African hinterland markets.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#021325"/>
      <stop offset="0.52" stop-color="#063064"/>
      <stop offset="1" stop-color="#0b6f9f"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#f3d675"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.38"/>
  <g opacity="0.22" fill="none" stroke="#b9eaff" stroke-width="2">
    <path d="M187 207c81-54 187-64 280-34 75 24 111 81 184 110 115 45 207-16 326 21 91 29 132 98 219 126 92 30 178-6 250 42"/>
    <path d="M211 677c111-79 215-96 316-51 108 48 185 161 326 130 128-28 165-153 288-173 93-15 172 41 244 97"/>
  </g>
  <g transform="translate(108 120)">
    <path d="M120 430c70-150 169-248 298-294 118-43 235-28 351 43 85 52 166 63 244 33 97-37 184-5 262 96 67 86 125 113 175 83" fill="none" stroke="rgba(125,211,252,0.18)" stroke-width="76" stroke-linecap="round"/>
    <path d="M120 430c70-150 169-248 298-294 118-43 235-28 351 43 85 52 166 63 244 33 97-37 184-5 262 96 67 86 125 113 175 83" fill="none" stroke="url(#line)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
  </g>
  <g font-family="Cairo, Tahoma, Arial" text-anchor="middle" font-weight="800">
    <g transform="translate(225 548)">
      <circle r="74" fill="rgba(2,19,37,0.74)" stroke="#7dd3fc" stroke-width="3"/>
      <text y="-8" font-size="28" fill="#e0f7ff">الميناء</text>
      <text y="25" font-size="18" fill="rgba(255,255,255,0.74)">Port</text>
    </g>
    <g transform="translate(430 318)">
      <circle r="74" fill="rgba(2,19,37,0.74)" stroke="#22d3ee" stroke-width="3"/>
      <text y="-8" font-size="25" fill="#e0f7ff">الهوية</text>
      <text y="25" font-size="17" fill="rgba(255,255,255,0.74)">Digital ID</text>
    </g>
    <g transform="translate(672 405)">
      <circle r="86" fill="rgba(2,19,37,0.8)" stroke="#f3d675" stroke-width="4" filter="url(#glow)"/>
      <text y="-12" font-size="30" fill="#fff7d6">الجسر</text>
      <text y="24" font-size="18" fill="rgba(255,255,255,0.78)">Blue Bridge</text>
    </g>
    <g transform="translate(930 315)">
      <circle r="74" fill="rgba(2,19,37,0.74)" stroke="#7dd3fc" stroke-width="3"/>
      <text y="-8" font-size="24" fill="#e0f7ff">الممر الآمن</text>
      <text y="25" font-size="17" fill="rgba(255,255,255,0.74)">Geofence</text>
    </g>
    <g transform="translate(1178 505)">
      <circle r="74" fill="rgba(2,19,37,0.74)" stroke="#22d3ee" stroke-width="3"/>
      <text y="-8" font-size="25" fill="#e0f7ff">بحر - جو</text>
      <text y="25" font-size="17" fill="rgba(255,255,255,0.74)">Sea-Air</text>
    </g>
    <g transform="translate(1402 428)">
      <circle r="74" fill="rgba(2,19,37,0.74)" stroke="#f3d675" stroke-width="3"/>
      <text y="-8" font-size="24" fill="#fff7d6">أسواق العمق</text>
      <text y="25" font-size="17" fill="rgba(255,255,255,0.74)">Hinterland</text>
    </g>
  </g>
  <g fill="none" stroke="rgba(255,255,255,0.72)" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <path d="M255 495h55l27-35h58"/>
    <path d="M702 321v-58h146"/>
    <path d="M950 388h90l52 62"/>
    <path d="M1246 489h62l38-32"/>
  </g>
  <g font-family="Cairo, Tahoma, Arial" font-weight="900">
    <text x="80" y="82" fill="#e0f7ff" font-size="36">مبادرة الجسر الأزرق الرقمي</text>
    <text x="80" y="124" fill="rgba(255,255,255,0.7)" font-size="21">تصور تشغيلي متكامل: تسجيل، تحقق، تتبع، عبور، تخليص، وربط دولي</text>
    <text x="1520" y="820" fill="rgba(255,255,255,0.72)" font-size="20" text-anchor="end">Qanwan · Digital Logistics Corridor</text>
  </g>
</svg>
